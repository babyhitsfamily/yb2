  <script>
    const App = {
      currentPage: 'dashboard',
      selectedPkg: 1,
      playerName: "Finalis Semifinal IPA",

      settings: {
        sound: true,
        volume: 0.2
      },

      activeSession: null,
      timerInterval: null,
      lastTimestamp: null,
      saveIndicatorText: "Tersimpan",

      // Full Review state (Opened after submission)
      fullReviewRecord: null,
      fullReviewIndex: 0,

      // Scoreboard Filter & Sort
      scoreFilter: 'all',
      scoreSort: 'highest',

      async init() {
        await LocalDB.init();
        this.loadSettings();
        this.bindEvents();

        const recovered = await LocalDB.getAnyActiveSession();
        if (recovered) {
          this.showRecoveryDialog(recovered);
        }

        this.render();
      },

      loadSettings() {
        try {
          const s = localStorage.getItem('YB_SEMI2_SETTINGS');
          if (s) {
            this.settings = Object.assign(this.settings, JSON.parse(s));
            SoundEngine.enabled = this.settings.sound;
            SoundEngine.volume = this.settings.volume;
          }
        } catch(e) {}
      },

      saveSettings() {
        try {
          localStorage.setItem('YB_SEMI2_SETTINGS', JSON.stringify(this.settings));
          SoundEngine.enabled = this.settings.sound;
          SoundEngine.volume = this.settings.volume;
        } catch(e) {}
      },

      showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const body = document.getElementById('toast-body');
        if (!toast || !body) return;

        let icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
        let bg = 'bg-labdark-900 border-emerald-500/50 text-white';

        if (type === 'error') {
          icon = '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>';
          bg = 'bg-labdark-900 border-rose-500/50 text-white';
        } else if (type === 'info') {
          icon = '<i class="fa-solid fa-circle-info text-scicyan-400"></i>';
          bg = 'bg-labdark-900 border-scicyan-500/50 text-white';
        }

        body.className = `px-4 py-2.5 rounded-2xl border flex items-center gap-2 text-xs font-semibold shadow-2xl ${bg}`;
        body.innerHTML = `${icon} <span>${msg}</span>`;

        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2600);
      },

      bindEvents() {
        document.addEventListener('visibilitychange', () => {
          if (document.hidden && this.activeSession && !this.activeSession.isPaused && !this.activeSession.isCompleted && this.currentPage === 'exam') {
            this.pauseSession(true);
          }
        });

        window.addEventListener('pagehide', () => {
          if (this.activeSession && !this.activeSession.isCompleted) {
            this.activeSession.status = 'paused';
            this.activeSession.isPaused = true;
            LocalDB.saveSession(this.activeSession);
          }
        });

        window.addEventListener('keydown', (e) => {
          if (this.currentPage !== 'exam' || !this.activeSession || this.activeSession.isPaused) return;

          const key = e.key.toUpperCase();
          if (['A', 'B', 'C', 'D'].includes(key)) {
            this.selectAnswer(key);
          } else if (e.key === 'ArrowRight') {
            this.nextQuestion();
          } else if (e.key === 'ArrowLeft') {
            this.prevQuestion();
          }
        });
      },

      showRecoveryDialog(sess) {
        const modal = document.getElementById('recovery-modal');
        const info = document.getElementById('recovery-info');
        const btnResume = document.getElementById('recovery-btn-resume');
        const btnDiscard = document.getElementById('recovery-btn-discard');

        let answered = 0;
        Object.values(sess.answers || {}).forEach(a => { if (a && a.selected) answered++; });
        const remainingFormatted = this.formatTime(sess.remainingSeconds || 6000);

        info.innerHTML = `
          <div class="flex justify-between text-slate-400"><span>Paket Latihan:</span><strong class="text-white">${sess.packageName}</strong></div>
          <div class="flex justify-between text-slate-400"><span>Posisi Terakhir:</span><strong class="text-scicyan-300">Soal #${(sess.currentQuestion || 0) + 1} dari 40</strong></div>
          <div class="flex justify-between text-slate-400"><span>Soal Terjawab:</span><strong class="text-emerald-400">${answered} dari 40 Soal</strong></div>
          <div class="flex justify-between text-slate-400"><span>Sisa Waktu:</span><strong class="font-mono text-accentgold">${remainingFormatted}</strong></div>
        `;

        modal.classList.remove('hidden');

        btnResume.onclick = () => {
          modal.classList.add('hidden');
          this.resumeSession(sess.packageId);
        };

        btnDiscard.onclick = () => {
          this.showConfirmModal(
            "Hapus Sesi Berjalan?",
            "Sesi ujian ini akan dibatalkan dan dihapus permanen.",
            async () => {
              modal.classList.add('hidden');
              await LocalDB.deleteSession(sess.packageId);
              this.render();
            }
          );
        };
      },

      navigate(page, pkgId = null) {
        SoundEngine.click();
        if (pkgId !== null) this.selectedPkg = pkgId;
        this.currentPage = page;
        window.scrollTo(0, 0);
        this.render();
      },

      async startNewSession(pkgId) {
        const questions = await LocalDB.getQuestions(pkgId);
        const newSession = {
          sessionId: `SESS_${pkgId}_${Date.now()}`,
          packageId: pkgId,
          packageName: `Paket ${pkgId} Semifinal`,
          status: 'in_progress',
          currentIndex: 0,
          currentQuestion: 0,
          totalQuestions: questions.length,
          remainingSeconds: 100 * 60,
          activeElapsedSeconds: 0,
          answers: {},
          isPaused: false,
          isCompleted: false,
          startedAt: new Date().toISOString(),
          lastSavedAt: new Date().toISOString()
        };

        this.activeSession = newSession;
        await LocalDB.saveSession(newSession);
        this.startTimer();
        this.navigate('exam', pkgId);
      },

      async resumeSession(pkgId) {
        const session = await LocalDB.getSession(pkgId);
        if (session && !session.isCompleted) {
          this.activeSession = session;
          this.activeSession.isPaused = false;
          this.activeSession.status = 'in_progress';
          await LocalDB.saveSession(this.activeSession);
          this.startTimer();
          this.navigate('exam', pkgId);
        } else {
          this.startNewSession(pkgId);
        }
      },

      startTimer() {
        this.stopTimer();
        this.lastTimestamp = Date.now();
        this.timerInterval = setInterval(async () => {
          if (!this.activeSession || this.activeSession.isPaused || this.activeSession.isCompleted) return;

          const now = Date.now();
          const deltaSec = Math.floor((now - this.lastTimestamp) / 1000);

          if (deltaSec >= 1) {
            this.lastTimestamp = now;
            if (this.activeSession.remainingSeconds > 0) {
              const dec = Math.min(deltaSec, this.activeSession.remainingSeconds);
              this.activeSession.remainingSeconds -= dec;
              this.activeSession.activeElapsedSeconds += dec;

              if (this.activeSession.activeElapsedSeconds % 5 === 0) {
                this.updateAutosaveIndicator("Menyimpan...");
                await LocalDB.saveSession(this.activeSession);
                this.updateAutosaveIndicator("Tersimpan");
              }

              const timerEl = document.getElementById('exam-timer-display');
              if (timerEl) {
                timerEl.textContent = this.formatTime(this.activeSession.remainingSeconds);
              }
            } else {
              this.handleTimeout();
            }
          }
        }, 500);
      },

      stopTimer() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
      },

      updateAutosaveIndicator(text) {
        this.saveIndicatorText = text;
        const el = document.getElementById('autosave-indicator');
        if (el) {
          el.innerHTML = `<i class="fa-solid ${text === 'Menyimpan...' ? 'fa-spinner fa-spin' : 'fa-cloud-arrow-up text-emerald-400'}"></i> <span>${text}</span>`;
        }
      },

      async pauseSession(silent = false) {
        if (!this.activeSession || this.activeSession.isPaused) return;
        if (!silent) SoundEngine.pause();
        this.stopTimer();
        this.activeSession.isPaused = true;
        this.activeSession.status = 'paused';
        await LocalDB.saveSession(this.activeSession);
        this.render();
      },

      async unpauseSession() {
        if (!this.activeSession) return;
        SoundEngine.resume();
        this.activeSession.isPaused = false;
        this.activeSession.status = 'in_progress';
        await LocalDB.saveSession(this.activeSession);
        this.startTimer();
        this.render();
      },

      handleTimeout() {
        this.stopTimer();
        SoundEngine.wrong();
        this.finishExam(true);
      },

      // SELECT OR CHANGE ANSWER (FREELY EDITED BEFORE FINAL SUBMIT)
      async selectAnswer(optionKey) {
        if (!this.activeSession || this.activeSession.isCompleted) return;
        const cIndex = this.activeSession.currentIndex;

        SoundEngine.select();
        this.activeSession.answers[cIndex] = {
          selected: optionKey,
          submitted: true
        };
        await LocalDB.saveSession(this.activeSession);
        this.render();
      },

      async prevQuestion() {
        if (!this.activeSession) return;
        SoundEngine.click();
        if (this.activeSession.currentIndex > 0) {
          this.activeSession.currentIndex--;
          this.activeSession.currentQuestion = this.activeSession.currentIndex;
          await LocalDB.saveSession(this.activeSession);
          this.render();
        }
      },

      async nextQuestion() {
        if (!this.activeSession) return;
        SoundEngine.click();
        if (this.activeSession.currentIndex < this.activeSession.totalQuestions - 1) {
          this.activeSession.currentIndex++;
          this.activeSession.currentQuestion = this.activeSession.currentIndex;
          await LocalDB.saveSession(this.activeSession);
          this.render();
        } else {
          this.confirmFinishExam();
        }
      },

      async goToQuestion(index) {
        if (!this.activeSession) return;
        SoundEngine.click();
        this.activeSession.currentIndex = Math.max(0, Math.min(this.activeSession.totalQuestions - 1, index));
        this.activeSession.currentQuestion = this.activeSession.currentIndex;
        await LocalDB.saveSession(this.activeSession);
        this.render();
      },

      confirmFinishExam() {
        if (!this.activeSession) return;
        SoundEngine.click();
        let answered = 0;
        for (let i = 0; i < this.activeSession.totalQuestions; i++) {
          if (this.activeSession.answers[i] && this.activeSession.answers[i].selected) {
            answered++;
          }
        }
        const blank = this.activeSession.totalQuestions - answered;

        this.showConfirmModal(
          "Kumpulkan & Selesaikan Simulasi?",
          `Anda telah mengisi ${answered} dari 40 soal (${blank} soal belum dijawab). Setelah disubmit, seluruh jawaban akan dinilai dengan skor resmi (+4/-1/0) dan kunci pembahasan lengkap akan dibuka.`,
          () => this.finishExam(false)
        );
      },

      async finishExam(isExpired = false) {
        this.stopTimer();
        if (!this.activeSession || this.activeSession.isCompleted) return;

        this.activeSession.isCompleted = true;
        this.activeSession.status = isExpired ? 'expired' : 'completed';
        const pkgId = this.activeSession.packageId;
        const questions = await LocalDB.getQuestions(pkgId);

        let correct = 0, wrong = 0, blank = 0;
        const finalizedAnswers = {};

        for (let i = 0; i < questions.length; i++) {
          const q = questions[i];
          const userEntry = this.activeSession.answers[i];
          if (userEntry && userEntry.selected) {
            const isCorrect = userEntry.selected === q.correctAnswer;
            if (isCorrect) correct++;
            else wrong++;

            finalizedAnswers[i] = {
              selected: userEntry.selected,
              isCorrect: isCorrect,
              submitted: true
            };
          } else {
            blank++;
            finalizedAnswers[i] = {
              selected: null,
              isCorrect: false,
              submitted: false
            };
          }
        }

        const finalScore = (correct * 4) - (wrong * 1);
        const resultRecord = {
          resultId: `RES_${pkgId}_${Date.now()}`,
          sessionId: this.activeSession.sessionId,
          packageId: pkgId,
          packageName: `Paket ${pkgId} Semifinal`,
          playerName: this.playerName,
          correct,
          wrong,
          blank,
          finalScore,
          durationSeconds: this.activeSession.activeElapsedSeconds,
          durationFormatted: this.formatTime(this.activeSession.activeElapsedSeconds),
          startedAt: this.activeSession.startedAt,
          completedAt: new Date().toLocaleString("id-ID", { dateStyle: 'medium', timeStyle: 'short' }),
          timestamp: Date.now(),
          answers: finalizedAnswers,
          completionStatus: isExpired ? 'expired' : 'completed'
        };

        await LocalDB.saveFinalResult(resultRecord);
        await LocalDB.deleteSession(pkgId);

        this.lastRecord = resultRecord;
        this.activeSession = null;
        SoundEngine.fanfare();
        this.navigate('result');
      },

      formatTime(seconds) {
        const s = Math.max(0, Math.floor(seconds));
        const hrs = Math.floor(s / 3600);
        const mins = Math.floor((s % 3600) / 60);
        const secs = s % 60;
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      },

      showConfirmModal(title, desc, onConfirm) {
        const modal = document.getElementById('custom-modal');
        const t = document.getElementById('modal-title');
        const d = document.getElementById('modal-desc');
        const btnConfirm = document.getElementById('modal-btn-confirm');
        const btnCancel = document.getElementById('modal-btn-cancel');

        t.textContent = title;
        d.textContent = desc;
        modal.classList.remove('hidden');

        const cleanup = () => {
          modal.classList.add('hidden');
          btnConfirm.onclick = null;
          btnCancel.onclick = null;
        };

        btnCancel.onclick = () => {
          SoundEngine.click();
          cleanup();
        };

        btnConfirm.onclick = () => {
          cleanup();
          onConfirm();
        };
      },

      // ==============================================================
      // RENDER VIEWS
      // ==============================================================
      render() {
        const root = document.getElementById('app');
        if (!root) return;

        switch (this.currentPage) {
          case 'prep':
            root.innerHTML = this.renderPrep();
            break;
          case 'exam':
            this.renderExamAsync();
            break;
          case 'result':
            root.innerHTML = this.renderResult();
            break;
          case 'scoreboard':
          case 'history':
            this.renderScoreboardAsync();
            break;
          case 'fullreview':
            this.renderFullReviewAsync();
            break;
          case 'guide':
            root.innerHTML = this.renderGuide();
            break;
          case 'dashboard':
          default:
            this.renderDashboardAsync();
            break;
        }
      },

              <div>

                  </div>
                  ${hasActive ? `
                    <div class="flex justify-between text-scicyan-400 pt-2 border-t border-slate-800">
                      <span>Progres Tersimpan:</span>
                      <span class="font-bold">Soal #${session.currentIndex + 1} / 40</span>
                    </div>
                  ` : ''}
                </div>
              </div>

              <div>
                ${hasActive ? `
                  <div class="grid grid-cols-2 gap-3">
                    <button onclick="App.resumeSession(${p})" class="py-3.5 rounded-xl bg-accentgold hover:bg-amber-400 text-labdark-950 font-game font-bold text-xs md:text-sm tracking-wide shadow-lg transition flex items-center justify-center gap-1.5">
                      <i class="fa-solid fa-play"></i> Lanjutkan

                    <button onclick="App.confirmRestart(${p})" class="py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-game font-bold text-xs md:text-sm transition">

                    <i class="fa-solid fa-gamepad text-base"></i> MULAI LATIHAN SIMULASI

              </div>

        root.innerHTML = `

              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-scicyan-500/20 border border-scicyan-400/50 flex items-center justify-center text-scicyan-400 text-xl cyan-glow">
                  <i class="fa-solid fa-flask-vial"></i>
                </div>
                <div>
                  <h1 class="text-xl font-tech font-black text-white tracking-wider leading-none">YUK-BELAJAR</h1>
                  <span class="text-[11px] text-scicyan-400 font-bold tracking-widest uppercase">PREDIKSI SEMIFINAL IPA • 2 PAKET CBT</span>
                </div>
              </div>

              <div class="flex items-center gap-2 sm:gap-3">
                <span class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-900 border border-slate-700 text-[10px] font-mono text-emerald-400">

      // EXAM VIEW (CBT MODE: REAL TIME NAVIGATION & CHANGING ANSWERS)

        const root = document.getElementById('app');
        if (!root) return;

        const session = this.activeSession;
        if (!session) {
          this.navigate('dashboard');
          return;
        }

        if (session.isPaused) {
          root.innerHTML = this.renderPauseOverlay();
          return;
        }

        const pkgId = session.packageId;
        const questions = await LocalDB.getQuestions(pkgId);
        const totalQ = session.totalQuestions;
        const cIndex = session.currentIndex;
        const qData = questions[cIndex];
        const userAns = session.answers[cIndex] || { selected: null };

        let answeredCount = 0;
        for (let i = 0; i < totalQ; i++) {
          if (session.answers[i] && session.answers[i].selected) answeredCount++;
        }
        const progressPct = Math.round((answeredCount / totalQ) * 100);

        // Build 1-40 Question Badges Grid
        const badgesHtml = [];
        for (let i = 0; i < totalQ; i++) {
          const a = session.answers[i];
          const hasAnswer = a && a.selected;
          const isCurrentActive = i === cIndex;

          let badgeBg = "bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700";

          if (hasAnswer) {
            badgeBg = "bg-scicyan-500/20 text-scicyan-300 border-scicyan-500/60 font-bold";
          }

          if (isCurrentActive) {
            badgeBg = "bg-accentgold text-labdark-950 font-extrabold border-amber-300 ring-2 ring-accentgold scale-105 shadow-md";
          }

          badgesHtml.push(`
            <button 
              type="button"
              onclick="App.goToQuestion(${i})"
              title="Soal ${i + 1}${hasAnswer ? ` (Terjawab: ${a.selected})` : ' (Belum dijawab)'}"
              class="w-8 h-8 rounded-xl border text-xs font-mono font-bold flex items-center justify-center transition-all ${badgeBg}">
              ${i + 1}
            </button>
          `);
        }

        root.innerHTML = `
          <div class="min-h-screen bg-labdark-950 text-slate-100 flex flex-col justify-between">
            <header class="glass-panel sticky top-0 z-20 border-b border-scicyan-500/30">
              <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <span class="text-xs font-game font-bold bg-scicyan-500/20 text-scicyan-300 border border-scicyan-400/40 px-3 py-1 rounded-xl">
                    PAKET ${pkgId}
                  </span>
                  <div class="font-game font-bold text-sm md:text-base text-white">
                    SOAL <span class="text-accentgold font-bold">${cIndex + 1}</span> / ${totalQ}
                  </div>
                </div>

                <div class="flex items-center gap-3">
                  <div id="autosave-indicator" class="hidden md:flex items-center gap-1.5 text-[11px] font-mono text-slate-400 bg-labdark-900 px-2.5 py-1 rounded-lg border border-slate-800">
                    <i class="fa-solid fa-cloud-arrow-up text-emerald-400"></i> <span>${this.saveIndicatorText}</span>
                  </div>

                  <div class="hidden sm:flex items-center gap-2 bg-labdark-900 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold">
                    <span class="text-slate-400">Terjawab:</span>
                    <span class="text-scicyan-300 font-bold">${answeredCount} / ${totalQ}</span>
                  </div>

                  <div class="flex items-center gap-2 bg-labdark-900 border border-scicyan-500/40 px-3.5 py-1.5 rounded-xl font-mono text-scicyan-300 font-bold text-sm md:text-base shadow-inner">

                    <span id="exam-timer-display">${this.formatTime(session.remainingSeconds)}</span>

              <div class="flex items-center justify-between text-xs text-slate-400 font-semibold mb-3">

                  <span class="px-2 py-0.5 rounded-lg bg-scicyan-500/10 border border-scicyan-400/30 uppercase text-[10px] font-bold">${qData.type}</span>
                  <i class="fa-solid fa-tag"></i> ${qData.topic}
                </span>
                <span class="text-slate-400">
                  Status: <strong class="${userAns.selected ? 'text-emerald-400' : 'text-slate-500'}">${userAns.selected ? `Terjawab (${userAns.selected})` : 'Belum Dijawab'}</strong>

                  ${qData.questionText}
                </div>

                <div class="space-y-3">
                  ${['A', 'B', 'C', 'D'].map(key => {
                    const text = qData.options[key];
                    if (!text) return '';

                    const isSelected = userAns.selected === key;

                    let btnClass = "border-slate-800 bg-labdark-900/80 hover:bg-labdark-850 hover:border-scicyan-500/50 text-slate-200";
                    let badgeClass = "bg-slate-800 text-slate-300 border-slate-700";

                    if (isSelected) {
                      btnClass = "border-scicyan-400 bg-scicyan-500/20 text-white ring-2 ring-scicyan-400/50 cyan-glow";
                      badgeClass = "bg-scicyan-500 text-labdark-950 font-bold border-scicyan-400";
                    }

                    return `
                      <button 
                        type="button"
                        onclick="App.selectAnswer('${key}')"
                        class="w-full text-left p-4 rounded-2xl border transition-all duration-200 flex items-start gap-3 ${btnClass}">
                        <span class="w-8 h-8 rounded-xl flex-shrink-0 flex items-center justify-center font-bold text-sm font-game border ${badgeClass}">

              <!-- Navigation Controls -->
              <div class="flex flex-wrap items-center justify-between gap-4 pt-2 mb-8">
                <div class="flex items-center gap-2">
                  <button 
                    onclick="App.prevQuestion()" 
                    ${cIndex === 0 ? 'disabled' : ''}

                    <i class="fa-solid fa-arrow-left"></i> Soal Sebelumnya

                    Soal Berikutnya <i class="fa-solid fa-arrow-right"></i>
                  </button>
                </div>

                <div>
                  <button 
                    onclick="App.confirmFinishExam()" 
                    class="px-7 py-3 rounded-2xl bg-gradient-to-r from-accentgold to-amber-500 hover:from-amber-400 hover:to-amber-500 text-labdark-950 font-game font-bold text-xs md:text-sm tracking-wide shadow-xl gold-glow transition flex items-center gap-2">
                    <i class="fa-solid fa-flag-checkered"></i> KUMPULKAN UJIAN
                  </button>
                </div>
              </div>

              <!-- Badges Grid Drawer (1-40) -->
              <div class="glass-panel rounded-3xl p-5 border border-slate-800">
                <div class="flex items-center justify-between mb-3 text-xs">
                  <span class="font-bold text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-list-ol text-scicyan-400"></i> LEMBAR JAWABAN (1 - 40)
                  </span>

                    <span class="flex items-center gap-1.5 text-accentgold font-semibold"><span class="w-2.5 h-2.5 rounded-full bg-accentgold"></span> Soal Aktif</span>
                    <span class="flex items-center gap-1.5 text-slate-400"><span class="w-2.5 h-2.5 rounded-full bg-slate-700"></span> Kosong</span>
                  </div>
                </div>
                <div class="flex flex-wrap gap-2 justify-center">
                  ${badgesHtml.join('')}
                </div>
              </div>

            </main>
          </div>
        `;
      },

        this.fullReviewRecord = record;
        this.fullReviewIndex = 0;
        this.navigate('fullreview');
      },

      async renderFullReviewAsync() {
        const root = document.getElementById('app');
        if (!root) return;

        const record = this.fullReviewRecord;
        if (!record) {
          this.navigate('dashboard');
          return;
        }

        const pkgId = record.packageId;
        const questions = await LocalDB.getQuestions(pkgId);
        const cIndex = this.fullReviewIndex;
        const qData = questions[cIndex];
        const userAns = record.answers ? record.answers[cIndex] : null;

        const badges = [];
        for (let i = 0; i < 40; i++) {
          const a = record.answers ? record.answers[i] : null;
          let badgeBg = "bg-slate-800 text-slate-400 border-slate-700";
          let icon = "";

          if (a && a.submitted) {
            if (a.isCorrect) {
              badgeBg = "bg-emerald-950 text-emerald-400 border-emerald-500/50";
              icon = '<i class="fa-solid fa-check text-[9px] ml-0.5"></i>';
            } else {
              badgeBg = "bg-rose-950 text-rose-400 border-rose-500/50";
              icon = '<i class="fa-solid fa-xmark text-[9px] ml-0.5"></i>';
            }
          }

          if (i === cIndex) {
            badgeBg += " ring-2 ring-scicyan-400 scale-110";
          }

          badges.push(`
            <button onclick="App.setFullReviewIndex(${i})" class="w-8 h-8 rounded-xl border text-xs font-mono font-bold flex items-center justify-center transition ${badgeBg}">
              ${i + 1}${icon}
            </button>
          `);
        }

        root.innerHTML = `
          <div class="min-h-screen bg-labdark-950 text-slate-100 flex flex-col justify-between">
            <header class="glass-panel sticky top-0 z-20 border-b border-scicyan-500/30">
              <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                <button onclick="App.navigate('result')" class="text-slate-400 hover:text-white text-xs font-semibold flex items-center gap-1.5 transition">
                  <i class="fa-solid fa-arrow-left"></i> Kembali ke Hasil
                </button>
                <div class="font-game font-bold text-sm text-scicyan-300">
                  REVIEW LENGKAP: ${record.packageName} (SOAL #${cIndex + 1} / 40)
                </div>
                <div class="text-xs font-mono text-slate-400">
                  Skor: <strong class="${record.finalScore >= 0 ? 'text-accentgold' : 'text-rose-400'}">${record.finalScore}</strong>
                </div>
              </div>
            </header>

            <main class="w-full max-w-3xl mx-auto px-4 py-8 flex-1 flex flex-col justify-center">
              <div class="mb-4 bg-scicyan-500/10 border border-scicyan-400/30 rounded-2xl p-3 text-xs text-scicyan-300 flex items-center justify-between">
                <span>EVALUASI AKHIR (READ ONLY)</span>
                <span class="font-mono">${userAns && userAns.submitted ? (userAns.isCorrect ? '+4 Poin' : '-1 Poin') : '0 Poin (Kosong)'}</span>
              </div>

              <div class="glass-panel rounded-3xl p-6 md:p-8 mb-6">
                <div class="text-xs font-bold text-scicyan-400 mb-2 uppercase tracking-wider">${qData.type} • ${qData.topic}</div>
                <div class="text-base text-slate-100 leading-relaxed mb-6 whitespace-pre-line">${qData.questionText}</div>

                <div class="space-y-3">
                  ${['A', 'B', 'C', 'D'].map(key => {
                    const text = qData.options[key];
                    const isSelected = userAns && userAns.selected === key;
                    const isCorrectKey = qData.correctAnswer === key;

                    let btnClass = "border-slate-800 bg-labdark-900/60 text-slate-400";
                    let badgeClass = "bg-slate-800 text-slate-400 border-slate-700";

                    if (isCorrectKey) {
                      btnClass = "border-emerald-500 bg-emerald-950/40 text-emerald-200 ring-2 ring-emerald-500/40";
                      badgeClass = "bg-emerald-600 text-white border-emerald-400";
                    } else if (isSelected && !isCorrectKey) {
                      btnClass = "border-rose-500 bg-rose-950/40 text-rose-200 ring-2 ring-rose-500/40";
                      badgeClass = "bg-rose-600 text-white border-rose-400";
                    }

                    return `
                      <div class="p-4 rounded-2xl border flex items-start gap-3 ${btnClass}">
                        <span class="w-8 h-8 rounded-xl flex-shrink-0 flex items-center justify-center font-bold text-sm font-game border ${badgeClass}">
                          ${key}
                        </span>
                        <span class="text-sm leading-snug pt-1 flex-1">${text}</span>
                        ${isCorrectKey ? '<span class="text-[11px] font-bold text-emerald-400 self-center">KUNCI RESMI</span>' : ''}
                        ${isSelected && !isCorrectKey ? '<span class="text-[11px] font-bold text-rose-400 self-center">JAWABAN KAMU</span>' : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <div class="glass-panel rounded-3xl p-6 mb-6 border-slate-700 bg-labdark-900">
                <h4 class="text-sm font-bold text-scicyan-300 mb-2 flex items-center gap-2">
                  <i class="fa-solid fa-lightbulb text-accentgold"></i> Pembahasan Lengkap:
                </h4>
                <div class="text-xs md:text-sm text-slate-300 leading-relaxed bg-labdark-950 p-4 rounded-2xl border border-slate-800">
                  ${qData.explanation}
                </div>
              </div>

              <div class="flex justify-between gap-4 mb-8">
                <button 
                  onclick="App.setFullReviewIndex(${cIndex - 1})"
                  ${cIndex === 0 ? 'disabled' : ''}
                  class="px-6 py-3 rounded-2xl bg-slate-800 disabled:opacity-30 text-white font-game font-bold text-xs transition">
                  <i class="fa-solid fa-arrow-left mr-1"></i> Soal Sebelumnya
                </button>
                <button 
                  onclick="App.setFullReviewIndex(${cIndex + 1})"
                  ${cIndex === 39 ? 'disabled' : ''}
                  class="px-6 py-3 rounded-2xl bg-scicyan-500 disabled:opacity-30 text-labdark-950 font-game font-bold text-xs transition">
                  Soal Berikutnya <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
              </div>

              <div class="glass-panel rounded-3xl p-5 border border-slate-800">
                <div class="flex flex-wrap gap-2 justify-center">
                  ${badges.join('')}
                </div>
              </div>
            </main>
          </div>
        `;
      },

      setFullReviewIndex(idx) {
        SoundEngine.click();
        this.fullReviewIndex = Math.max(0, Math.min(39, idx));
        this.render();
      },

      // SCOREBOARD & HISTORY VIEW
      async renderScoreboardAsync() {
        const root = document.getElementById('app');
        if (!root) return;

        let history = await LocalDB.getScoreboard();

        if (this.scoreFilter !== 'all') {
          const p = parseInt(this.scoreFilter);
          history = history.filter(h => h.packageId === p);
        }

        if (this.scoreSort === 'highest') {
          history.sort((a, b) => b.finalScore - a.finalScore || a.durationSeconds - b.durationSeconds);
        } else if (this.scoreSort === 'newest') {
          history.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        }

        root.innerHTML = `
          <div class="min-h-screen flex flex-col justify-between">
            <header class="w-full max-w-5xl mx-auto px-4 py-5 flex items-center justify-between border-b border-slate-800">
              <button onclick="App.navigate('dashboard')" class="text-slate-400 hover:text-white text-xs font-semibold flex items-center gap-2 transition">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
              </button>
              <h2 class="text-lg md:text-xl font-game font-bold text-accentgold flex items-center gap-2">
                <i class="fa-solid fa-trophy"></i> ARENA SCORE BOARD
              </h2>
              <div class="flex items-center gap-2">
                <input type="file" id="import-backup-file" accept=".json" class="hidden" onchange="App.handleImportFile(event)">
                <button onclick="document.getElementById('import-backup-file').click()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-bold text-slate-300 transition">
                  <i class="fa-solid fa-upload mr-1"></i> Impor
                </button>
                <button onclick="LocalDB.exportBackup()" class="px-3 py-1.5 rounded-xl bg-scicyan-500/20 text-scicyan-300 border border-scicyan-500/40 hover:bg-scicyan-500 hover:text-labdark-950 text-xs font-bold transition">
                  <i class="fa-solid fa-download mr-1"></i> Ekspor
                </button>
              </div>
            </header>

            <main class="w-full max-w-5xl mx-auto px-4 py-8 flex-1">
              <div class="glass-panel rounded-2xl p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold text-slate-400 uppercase">Filter:</span>
                  <div class="inline-flex rounded-xl bg-labdark-950 p-1 border border-slate-800">
                    <button onclick="App.setScoreFilter('all')" class="px-3 py-1 text-xs rounded-lg font-bold transition ${this.scoreFilter === 'all' ? 'bg-scicyan-500 text-labdark-950' : 'text-slate-400 hover:text-white'}">Semua</button>
                    <button onclick="App.setScoreFilter(1)" class="px-3 py-1 text-xs rounded-lg font-bold transition ${this.scoreFilter === 1 ? 'bg-scicyan-500 text-labdark-950' : 'text-slate-400 hover:text-white'}">Paket 1</button>
                    <button onclick="App.setScoreFilter(2)" class="px-3 py-1 text-xs rounded-lg font-bold transition ${this.scoreFilter === 2 ? 'bg-scicyan-500 text-labdark-950' : 'text-slate-400 hover:text-white'}">Paket 2</button>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold text-slate-400 uppercase">Urutkan:</span>
                  <div class="inline-flex rounded-xl bg-labdark-950 p-1 border border-slate-800">
                    <button onclick="App.setScoreSort('highest')" class="px-3 py-1 text-xs rounded-lg font-bold transition ${this.scoreSort === 'highest' ? 'bg-accentgold text-labdark-950' : 'text-slate-400 hover:text-white'}">
                      <i class="fa-solid fa-arrow-down-wide-short mr-1"></i> Skor Tertinggi
                    </button>
                    <button onclick="App.setScoreSort('newest')" class="px-3 py-1 text-xs rounded-lg font-bold transition ${this.scoreSort === 'newest' ? 'bg-accentgold text-labdark-950' : 'text-slate-400 hover:text-white'}">
                      <i class="fa-solid fa-clock mr-1"></i> Waktu Terbaru
                    </button>
                  </div>
                </div>
              </div>

              ${history.length === 0 ? `
                <div class="text-center py-16 glass-panel rounded-3xl max-w-md mx-auto p-8">
                  <div class="w-16 h-16 rounded-2xl bg-slate-800 text-slate-400 text-3xl mx-auto flex items-center justify-center mb-4">
                    <i class="fa-solid fa-hourglass-start"></i>
                  </div>
                  <h3 class="text-lg font-game font-bold text-white mb-1">BELUM ADA HASIL LATIHAN</h3>
                  <p class="text-xs text-slate-400 mb-6">Mulai simulasi dan buktikan kemampuanmu di babak semifinal!</p>
                  <button onclick="App.navigate('dashboard')" class="px-6 py-3 rounded-xl bg-scicyan-500 text-labdark-950 font-game font-bold text-xs cyan-glow transition">
                    PILIH PAKET LATIHAN
                  </button>
                </div>
              ` : `
                <div class="glass-panel rounded-3xl border border-slate-800 overflow-hidden shadow-2xl">
                  <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs md:text-sm">
                      <thead class="bg-labdark-950 text-slate-400 font-bold uppercase text-[11px] border-b border-slate-800">
                        <tr>
                          <th class="py-4 px-4">Peringkat</th>
                          <th class="py-4 px-4">Paket</th>
                          <th class="py-4 px-4">Waktu Selesai</th>
                          <th class="py-4 px-4 text-center">Durasi</th>
                          <th class="py-4 px-4 text-center">Benar</th>
                          <th class="py-4 px-4 text-center">Salah</th>
                          <th class="py-4 px-4 text-center">Kosong</th>
                          <th class="py-4 px-4 text-right">Skor Akhir</th>
                          <th class="py-4 px-4 text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-800 font-medium">
                        ${history.map((r, idx) => `
                          <tr class="hover:bg-slate-800/40 transition">
                            <td class="py-3.5 px-4 font-bold ${idx === 0 ? 'text-accentgold' : 'text-slate-400'}">
                              ${idx === 0 ? '<i class="fa-solid fa-crown mr-1"></i>' : ''}#${idx + 1}
                            </td>
                            <td class="py-3.5 px-4 font-game font-bold text-white">${r.packageName}</td>
                            <td class="py-3.5 px-4 text-slate-400 text-xs">${r.completedAt}</td>
                            <td class="py-3.5 px-4 text-center font-mono text-slate-300">${r.durationFormatted}</td>
                            <td class="py-3.5 px-4 text-center text-emerald-400 font-bold">${r.correct}</td>
                            <td class="py-3.5 px-4 text-center text-rose-400 font-bold">${r.wrong}</td>
                            <td class="py-3.5 px-4 text-center text-slate-400">${r.blank}</td>
                            <td class="py-3.5 px-4 text-right font-tech font-bold text-base ${r.finalScore >= 0 ? 'text-accentgold' : 'text-rose-400'}">
                              ${r.finalScore}
                            </td>
                            <td class="py-3.5 px-4 text-center">
                              <button onclick="App.openSavedResultReview('${r.resultId}')" class="px-3 py-1 rounded-lg bg-scicyan-500/20 text-scicyan-300 hover:bg-scicyan-500 hover:text-labdark-950 font-bold text-xs transition">
                                Review
                              </button>
                            </td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                </div>
              `}
            </main>
          </div>
        `;
      },

      async openSavedResultReview(resultId) {
        const res = await LocalDB.getResultById(resultId);
        if (res) {
          this.openFullReview(res);
        } else {
          this.showToast("Catatan hasil tidak ditemukan", "error");
        }
      },

      async handleImportFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            await LocalDB.importBackup(e.target.result);
            this.showToast("Data backup berhasil dipulihkan!");
            this.render();
          } catch(err) {
            this.showToast(err.message, "error");
          }
        };
        reader.readAsText(file);
      },

      setScoreFilter(filter) {
        SoundEngine.click();
        this.scoreFilter = filter;
        this.render();
      },

      setScoreSort(sort) {
        SoundEngine.click();
        this.scoreSort = sort;
        this.render();
      },

      // GUIDE VIEW
      renderGuide() {
        return `
          <div class="min-h-screen flex flex-col justify-between">
            <header class="w-full max-w-4xl mx-auto px-4 py-6 flex items-center justify-between border-b border-slate-800">
              <button onclick="App.navigate('dashboard')" class="text-slate-400 hover:text-white text-xs font-semibold flex items-center gap-1.5 transition">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
              </button>
              <h2 class="text-xl font-game font-bold text-scicyan-300 flex items-center gap-2">
                <i class="fa-solid fa-book-open"></i> PANDUAN SIMULASI CBT
              </h2>
              <div class="w-16"></div>
            </header>

            <main class="w-full max-w-3xl mx-auto px-4 py-8 flex-1">
              <div class="glass-panel rounded-3xl p-6 md:p-8 space-y-6 text-sm text-slate-300 leading-relaxed shadow-2xl">
                <div>
                  <h3 class="text-base font-game font-bold text-white mb-1 flex items-center gap-2">
                    <span class="w-7 h-7 rounded-xl bg-scicyan-500/20 text-scicyan-300 flex items-center justify-center text-xs">1</span>
                    Struktur 2 Paket Prediksi
                  </h3>
                  <p>Aplikasi ini memuat 2 paket soal prediksi semifinal (@ 40 butir soal, total 80 butir). Soal disusun seimbang antara bidang Hayati/Fisiologi dan Fisik/Kimia/Antariksa berbasis stimulus eksperimen dan penalaran HOTS.</p>
                </div>

                <div>
                  <h3 class="text-base font-game font-bold text-white mb-1 flex items-center gap-2">
                    <span class="w-7 h-7 rounded-xl bg-scicyan-500/20 text-scicyan-300 flex items-center justify-center text-xs">2</span>
                    Alur Pengerjaan CBT Riil
                  </h3>
                  <p>Jawaban yang dipilih akan langsung tersimpan tanpa menampilkan status benar/salah secara langsung. Anda dapat berpindah nomor soal secara bebas dan mengganti pilihan jawaban kapan saja sebelum menekan <strong>Kumpulkan Ujian</strong>.</p>
                </div>

                <div>
                  <h3 class="text-base font-game font-bold text-white mb-1 flex items-center gap-2">
                    <span class="w-7 h-7 rounded-xl bg-accentgold/20 text-accentgold flex items-center justify-center text-xs">3</span>
                    Aturan Skoring Olimpiade
                  </h3>
                  <ul class="list-disc list-inside mt-2 space-y-1">
                    <li><strong class="text-emerald-400">Jawaban Benar:</strong> +4 Poin</li>
                    <li><strong class="text-rose-400">Jawaban Salah:</strong> -1 Poin</li>
                    <li><strong class="text-slate-400">Jawaban Kosong:</strong> 0 Poin</li>
                  </ul>
                </div>

                <div>
                  <h3 class="text-base font-game font-bold text-white mb-1 flex items-center gap-2">
                    <span class="w-7 h-7 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-xs">4</span>
                    Evaluasi & Pembahasan di Akhir
                  </h3>
                  <p>Setelah seluruh soal disubmit atau waktu 100 menit berakhir, sistem akan mengkalkulasi skor akhir dan membuka naskah evaluasi 40 butir lengkap beserta kunci jawaban resmi dan pembahasan ilmiahnya.</p>
                </div>

                <div class="pt-4 border-t border-slate-800 text-center">
                  <button onclick="App.navigate('dashboard')" class="px-8 py-3.5 rounded-2xl bg-scicyan-500 text-labdark-950 font-game font-bold text-sm cyan-glow transition">
                    SAYA PAHAM, KEMBALI KE LOBBY
                  </button>
                </div>
              </div>
            </main>
          </div>
        `;
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
