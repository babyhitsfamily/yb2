  <!-- 1. AUDIO SYNTHESIS ENGINE (WEB AUDIO API)                      -->
  <!-- ============================================================== -->
  <script>
    const SoundEngine = {
      audioCtx: null,
      enabled: true,
      volume: 0.2,

      init() {
        if (!this.audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.audioCtx = new AudioContext();
          }
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      },

      playTone(freq, type, duration, delay = 0, volMultiplier = 1) {
        if (!this.enabled) return;
        this.init();
        if (!this.audioCtx) return;

        setTimeout(() => {
          try {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
            
            const targetVol = this.volume * volMultiplier;
            gain.gain.setValueAtTime(targetVol, this.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, this.audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            osc.start();
            osc.stop(this.audioCtx.currentTime + duration);
          } catch(e) {}
        }, delay);
      },

      click() { this.playTone(880, 'sine', 0.05, 0, 0.5); },
      select() { this.playTone(540, 'triangle', 0.08, 0, 0.6); },
      correct() {
        this.playTone(523.25, 'triangle', 0.12, 0, 0.8);
        this.playTone(659.25, 'triangle', 0.14, 100, 0.9);
        this.playTone(783.99, 'sine', 0.25, 200, 1.0);
        this.playTone(1046.50, 'sine', 0.35, 320, 1.1);
      },
      wrong() {
        this.playTone(280, 'sawtooth', 0.16, 0, 0.7);
        this.playTone(210, 'sawtooth', 0.25, 120, 0.8);
      },
      pause() {
        this.playTone(440, 'sine', 0.1, 0, 0.5);
        this.playTone(330, 'sine', 0.15, 80, 0.5);
      },
      resume() {
        this.playTone(330, 'sine', 0.1, 0, 0.5);
        this.playTone(440, 'sine', 0.15, 80, 0.5);
      },
      fanfare() {
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((f, idx) => {
          this.playTone(f, 'triangle', 0.35, idx * 110, 0.8);
        });
      }
    };
  </script>
